name: Build AI Tip of the Day

on:
  schedule:
    - cron: "30 3 * * *"     # 03:30 UTC = 09:00 IST, every day; the email goes out at 11:00 IST (2 h buffer)
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write             # needed to commit docs/ and data/sent.json back to the repo

concurrency:
  group: daily-tip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build today's tip
        run: python tip_bot.py
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'none' }}      # set to "gemini" to enable AI summaries
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # only needed when LLM_PROVIDER=gemini
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          TIP_SUBMIT_URL: ${{ vars.TIP_SUBMIT_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Publish (commit) today's tip
        run: |
          git config user.name "ai-tip-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs data
          git commit -m "AI tip for $(date -u +%F)" || echo "Nothing new to commit"
          git push
