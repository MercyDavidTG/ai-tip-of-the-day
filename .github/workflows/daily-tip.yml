name: Build Insights of the Day

on:
  schedule:
    # Monday-Friday. GitHub often delays or drops scheduled runs, worst at :00 and :30, so there are
    # eight chances at :17 and :47 (06:47 to 10:17 IST); the first one builds the tip, the others see
    # it's done and stop. The email goes out at 11:00 IST from Power Automate.
    - cron: "17,47 1-4 * * 1-5"
  workflow_dispatch:          # lets you run it by hand from the Actions tab

# Nothing by default; the job below asks only for what it needs.
permissions: {}

concurrency:
  group: daily-tip
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write         # only to push the built tip (docs/, data/sent.json) to the site branch
    steps:
      # main is protected (changes go in through pull requests), so the built tips live on the
      # "site" branch, which GitHub Pages serves. Each run starts from site and merges in main's code.
      - uses: actions/checkout@v4
        with:
          ref: site
          fetch-depth: 0

      - name: Bring in the latest code from main
        run: |
          git config user.name "MercyDavidTG"
          git config user.email "285697807+MercyDavidTG@users.noreply.github.com"
          git merge --no-edit origin/main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build today's tip
        run: python tip_bot.py
        env:
          TIP_SUBMIT_URL: ${{ vars.TIP_SUBMIT_URL }}
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

      - name: Publish (commit) today's tip to the site branch
        run: |
          git add docs data
          git commit -m "Insight for $(date -u +%F)" || echo "Nothing new to commit"
          git pull --no-rebase --no-edit origin site
          git push origin HEAD:site
